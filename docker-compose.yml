services:
  postgres:
    image: postgres:15-alpine
    container_name: taewoong-postgres
    environment:
      POSTGRES_DB: taewoong_furnace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: taewoong-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taewoong-backend
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taewoong_furnace?schema=public
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRATION: 24h
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: taewoong-furnace
      MINIO_USE_SSL: 'false'
      PORT: '3000'
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/prisma/generated

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taewoong-frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:

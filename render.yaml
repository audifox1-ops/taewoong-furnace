services:
  - type: web
    name: taewoong-furnace-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Render 대시보드에서 직접 입력해야 함
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://twmakeppt.vercel.app,https://taewoong-furnace.vercel.app
